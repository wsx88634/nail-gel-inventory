<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>美甲膠庫存管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
    <style type="text/tailwindcss">
        input[type="text"], input[type="date"], input[type="number"], select {
            @apply border-slate-200 bg-slate-50/50 rounded-lg p-2 text-slate-700 text-sm transition focus:bg-white focus:ring-2 focus:ring-teal-100 focus:border-teal-400 outline-none;
        }
        label {
            @apply block text-xs font-semibold text-slate-500 tracking-wide mb-1.5;
        }
        .btn-primary {
            @apply bg-sky-100 border-2 border-sky-200 hover:bg-sky-200 hover:border-sky-300 text-sky-700 font-bold py-2.5 px-5 rounded-xl shadow-sm transition duration-200 active:scale-95;
        }
        .btn-icon {
            @apply p-1.5 bg-white border border-slate-200 rounded-lg shadow-sm transition hover:shadow active:scale-95 flex items-center justify-center;
        }
    </style>
</head>
<body class="bg-slate-100/50 text-slate-800 font-sans antialiased pb-24">
    <!-- 導覽列 -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-20 shadow-sm shadow-slate-100">
        <div class="container mx-auto px-4 py-3.5 flex justify-between items-center max-w-4xl">
            <h1 class="text-xl font-bold text-slate-700 tracking-wide">🌿 美甲膠庫存管理</h1>
        </div>
    </header>

    <main class="container mx-auto px-4 mt-8 max-w-5xl" x-data="appData()">
        
        <!-- 新增表單區塊 -->
        <section id="addFormSection" class="bg-white rounded-2xl shadow-sm border border-slate-200/60 p-6 mb-10 relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-teal-300 to-emerald-400"></div>
            <h2 class="text-base font-bold text-slate-700 mb-5 flex items-center">
                <svg class="w-5 h-5 text-teal-500 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                新增美甲膠
            </h2>
            <form @submit.prevent="submitForm" class="space-y-5">
                <div class="grid grid-cols-1 sm:grid-cols-12 gap-5">
                    <div class="sm:col-span-3">
                        <label>品牌名稱</label>
                        <input type="text" x-model="formData.brand" id="brand_input" required class="w-full" placeholder="例如: Presto">
                    </div>
                    <div class="sm:col-span-3">
                        <label>店內編碼</label>
                        <input type="text" x-model="formData.shop_code" id="shop_code_input" required class="w-full" placeholder="例如: A01">
                    </div>
                    <div class="sm:col-span-4">
                        <label>色號</label>
                        <input type="text" x-model="formData.color_name" required class="w-full" placeholder="例如: #214">
                    </div>
                    <div class="sm:col-span-2">
                        <label>預覽色</label>
                        <input type="color" x-model="formData.hex_color" class="w-full h-[38px] border-slate-200 rounded-lg border cursor-pointer p-0.5 bg-slate-50">
                    </div>
                    
                    <div class="sm:col-span-4">
                        <label>製造日期</label>
                        <input type="date" x-model="formData.mfg_date" required class="w-full">
                    </div>
                    <div class="sm:col-span-8">
                        <label>有效年限</label>
                        <div class="flex flex-col sm:flex-row sm:items-center space-y-3 sm:space-y-0 sm:space-x-6 mt-1.5">
                            <div class="flex items-center space-x-6">
                                <label class="!mb-0 flex items-center cursor-pointer !text-sm !font-medium !text-slate-600">
                                    <input type="radio" x-model="formData.exp_type" value="3" class="mr-2 text-teal-500 focus:ring-teal-400 w-4 h-4"> 3 年
                                </label>
                                <label class="!mb-0 flex items-center cursor-pointer !text-sm !font-medium !text-slate-600">
                                    <input type="radio" x-model="formData.exp_type" value="5" class="mr-2 text-teal-500 focus:ring-teal-400 w-4 h-4"> 5 年
                                </label>
                                <label class="!mb-0 flex items-center cursor-pointer !text-sm !font-medium !text-slate-600">
                                    <input type="radio" x-model="formData.exp_type" value="other" class="mr-2 text-teal-500 focus:ring-teal-400 w-4 h-4"> 其他
                                </label>
                            </div>
                            <div x-show="formData.exp_type === 'other'" x-transition class="w-32">
                                <input type="number" x-model.number="formData.custom_exp" placeholder="輸入年數" class="w-full !p-1 text-center" min="1">
                            </div>
                        </div>
                    </div>
                </div>
                <div class="pt-2">
                    <button type="submit" class="w-full sm:w-auto btn-primary">
                        加入庫存清單
                    </button>
                </div>
            </form>
        </section>

        <!-- 庫存清單區塊 -->
        <section>
            <div class="flex items-center justify-between mb-5 px-1">
                <h2 class="text-base font-bold text-slate-700 flex items-center">
                    <span class="w-1.5 h-4 bg-slate-400 rounded-full mr-2"></span>庫存清單
                </h2>
            </div>
            
            <template x-if="Object.keys(groupedGels).length === 0">
                <div class="text-center py-16 bg-white rounded-2xl border border-slate-200 border-dashed">
                    <p class="text-slate-400">目前還沒有庫存紀錄哦！</p>
                </div>
            </template>
            
            <div class="space-y-8">
                <template x-for="(gels, brand) in groupedGels" :key="brand">
                    <div x-data="{ expanded: true }" class="space-y-3">
                        <!-- 品牌 Header -->
                        <div class="flex items-center justify-between px-1">
                            <div class="flex items-center space-x-3">
                                <button @click="expanded = !expanded" class="flex items-center text-lg font-bold text-slate-700 hover:text-teal-600 transition group">
                                    <svg class="w-5 h-5 mr-1 text-slate-400 group-hover:text-teal-500 transform transition-transform" :class="{'rotate-90': expanded}" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                                    <span x-text="brand" class="tracking-wide"></span>
                                </button>
                                <span class="bg-slate-200/70 text-slate-600 text-[11px] py-0.5 px-2.5 rounded-full font-bold" x-text="gels.length"></span>
                            </div>
                            <div class="flex items-center space-x-6"> <!-- 增加間距防止誤按 -->
                                <button @click.stop="quickAdd(brand)" class="btn-icon text-teal-600 hover:bg-teal-50 hover:border-teal-200" title="在此品牌新增品項">
                                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path></svg>
                                </button>
                                <button @click.stop="confirmDeleteBrand(brand)" class="btn-icon text-slate-400 hover:text-rose-500 hover:bg-rose-50 hover:border-rose-200" title="刪除整個品牌">
                                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                </button>
                            </div>
                        </div>
                        
                        <!-- 品項列表 (強制一行顯示) -->
                        <div x-show="expanded" x-collapse x-transition class="space-y-3 overflow-x-auto pb-1">
                            <div class="min-w-[700px]"> <!-- 確保在小螢幕時也能排在同一行，透過左右滑動觀看，或者強制縮小 -->
                                <template x-for="gel in gels" :key="gel.id">
                                    <div class="bg-white rounded-xl shadow-sm border border-slate-200/70 hover:shadow transition relative mb-3 group">
                                        <!-- 正常顯示模式 (強制一行 flex-row) -->
                                        <div x-show="editingId !== gel.id" class="px-5 py-3.5 flex items-center justify-between" :class="{'bg-rose-50/40': gel.is_warning}">
                                            
                                            <!-- 左側：識別 -->
                                            <div class="flex items-center space-x-3 w-[25%] shrink-0">
                                                <div class="w-8 h-8 rounded-full shadow-inner border border-slate-200/50 flex-shrink-0" :style="`background-color: ${gel.hex_color}`"></div>
                                                <div class="font-bold text-slate-800 flex items-center space-x-2 text-[15px]">
                                                    <span x-text="gel.shop_code" class="text-[11px] bg-slate-100 text-slate-500 border border-slate-200 rounded px-1.5 py-0.5"></span>
                                                    <span x-text="gel.color_name" class="tracking-wide whitespace-nowrap"></span>
                                                </div>
                                            </div>
                                            
                                            <!-- 中間：詳細資訊 -->
                                            <div class="flex items-center space-x-8 text-sm text-slate-500 w-[45%] shrink-0 pl-4">
                                                <div class="flex items-center space-x-1.5 whitespace-nowrap">
                                                    <svg class="w-4 h-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                                                    <span>製造: <span x-text="gel.mfg_date"></span></span>
                                                </div>
                                                <div class="flex items-center space-x-1.5 whitespace-nowrap">
                                                    <svg class="w-4 h-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                                    <span>保存 <span x-text="gel.exp_years"></span> 年</span>
                                                </div>
                                            </div>
                                            
                                            <!-- 右側：到期日 -->
                                            <div class="text-sm tracking-wide w-[20%] text-right pr-4 whitespace-nowrap shrink-0" :class="gel.is_warning ? 'text-rose-500 font-bold' : 'text-slate-500'">
                                                <span x-show="gel.is_warning" class="mr-1">⚠️</span>
                                                <span x-text="gel.exp_date"></span> 到期
                                            </div>

                                            <!-- 按鈕操作區 (扳手與垃圾桶) -->
                                            <div class="flex items-center space-x-2 shrink-0">
                                                <!-- 編輯：扳手圖示 -->
                                                <button @click.stop="startEdit(gel)" class="btn-icon text-teal-600 hover:bg-teal-50 border-transparent shadow-none hover:shadow-sm" title="編輯">
                                                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.121 14.121L19 19m-7-7l-7-7m0 0l2.828-2.828a2 2 0 012.828 0l1.414 1.414a2 2 0 010 2.828l-1.414 1.414a2 2 0 01-2.828 0L5.343 5.343a2 2 0 010-2.828L8.172 2.515M14.121 14.121l2.828-2.828m0 0l1.414 1.414a2 2 0 010 2.828l-2.828 2.828a2 2 0 01-2.828 0L14.121 14.121z"></path></svg>
                                                </button>
                                                <!-- 刪除：垃圾桶圖示 -->
                                                <button @click.stop="confirmDeleteGel(gel.id)" class="btn-icon text-slate-400 hover:text-rose-500 hover:bg-rose-50 border-transparent shadow-none hover:shadow-sm" title="刪除">
                                                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                                </button>
                                            </div>
                                        </div>

                                        <!-- 編輯模式表單 -->
                                        <div x-show="editingId === gel.id" class="p-5 bg-teal-50/40 relative">
                                            <div class="absolute top-0 left-0 w-1 h-full bg-teal-400"></div>
                                            <div class="grid grid-cols-1 sm:grid-cols-12 gap-4">
                                                <div class="sm:col-span-3">
                                                    <label>品牌</label>
                                                    <input type="text" x-model="editForm.brand" class="w-full !bg-white">
                                                </div>
                                                <div class="sm:col-span-2">
                                                    <label>店內編碼</label>
                                                    <input type="text" x-model="editForm.shop_code" class="w-full !bg-white">
                                                </div>
                                                <div class="sm:col-span-3">
                                                    <label>色號</label>
                                                    <input type="text" x-model="editForm.color_name" class="w-full !bg-white">
                                                </div>
                                                <div class="sm:col-span-2">
                                                    <label>預覽色</label>
                                                    <input type="color" x-model="editForm.hex_color" class="w-full h-[38px] border-slate-200 rounded-lg border cursor-pointer p-0.5 bg-white">
                                                </div>
                                                <div class="sm:col-span-4">
                                                    <label>製造日期</label>
                                                    <input type="date" x-model="editForm.mfg_date" class="w-full !bg-white">
                                                </div>
                                                <div class="sm:col-span-8 flex flex-col justify-center pt-5">
                                                    <div class="flex items-center space-x-4">
                                                        <label class="!mb-0 flex items-center cursor-pointer !text-sm !font-medium !text-slate-600">
                                                            <input type="radio" x-model="editForm.exp_type" value="3" class="mr-1 text-teal-500 w-4 h-4"> 3 年
                                                        </label>
                                                        <label class="!mb-0 flex items-center cursor-pointer !text-sm !font-medium !text-slate-600">
                                                            <input type="radio" x-model="editForm.exp_type" value="5" class="mr-1 text-teal-500 w-4 h-4"> 5 年
                                                        </label>
                                                        <label class="!mb-0 flex items-center cursor-pointer !text-sm !font-medium !text-slate-600">
                                                            <input type="radio" x-model="editForm.exp_type" value="other" class="mr-1 text-teal-500 w-4 h-4"> 其他
                                                        </label>
                                                        <div x-show="editForm.exp_type === 'other'" class="w-20 ml-2">
                                                            <input type="number" x-model.number="editForm.custom_exp" class="w-full !bg-white !p-1 text-center" min="1">
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="mt-5 flex justify-end space-x-3 border-t border-teal-100/50 pt-3">
                                                <button @click="cancelEdit()" class="text-sm font-medium text-slate-500 hover:text-slate-700 px-3 py-2 transition">取消</button>
                                                <button @click="saveEdit()" class="btn-primary py-1.5 px-5 text-sm">儲存變更</button>
                                            </div>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </section>
        
        <!-- 自訂刪除確認 Modal -->
        <div x-show="modal.isOpen" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm" x-transition.opacity style="display: none;">
            <div @click.outside="modal.isOpen = false" class="bg-white rounded-2xl shadow-xl w-full max-w-sm overflow-hidden" x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0 scale-90" x-transition:enter-end="opacity-100 scale-100">
                <div class="p-6 text-center">
                    <div class="w-12 h-12 rounded-full bg-rose-100 text-rose-500 mx-auto flex items-center justify-center mb-4">
                        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                    </div>
                    <h3 class="text-lg font-bold text-slate-800 mb-2" x-text="modal.title"></h3>
                    <p class="text-sm text-slate-500 mb-6" x-text="modal.message"></p>
                    <div class="flex space-x-3">
                        <button @click="modal.isOpen = false" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-2.5 rounded-xl transition">取消</button>
                        <button @click="modal.confirm()" class="flex-1 bg-rose-500 hover:bg-rose-600 text-white font-medium py-2.5 rounded-xl shadow-sm shadow-rose-200 transition">確定刪除</button>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <script>
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbxIHfWauVk2AYvjbSGVloJ2pdQPoduILLMKyTC7M0HwLFKri3RxcnCSo9NHtVvRa9NkAA/exec';

        document.addEventListener('alpine:init', () => {
            Alpine.data('appData', () => ({
                gels: [],
                formData: {
                    brand: '',
                    shop_code: '',
                    color_name: '',
                    hex_color: '#ffb6c1',
                    mfg_date: new Date().toISOString().split('T')[0],
                    exp_type: '3',
                    custom_exp: 3
                },
                
                editingId: null,
                editForm: {},
                
                modal: {
                    isOpen: false,
                    title: '',
                    message: '',
                    action: null,
                    confirm() {
                        if(this.action) this.action();
                        this.isOpen = false;
                    }
                },
                
                init() {
                    this.fetchGels();
                },
                
                get groupedGels() {
                    return this.gels.reduce((acc, gel) => {
                        if (!acc[gel.brand]) acc[gel.brand] = [];
                        acc[gel.brand].push(gel);
                        return acc;
                    }, {});
                },
                
                formatGel(gel) {
                    let mfg = new Date(gel.mfg_date);
                    let formattedMfg = gel.mfg_date;
                    let formattedExp = '';
                    let isWarning = false;
                    
                    if (!isNaN(mfg.getTime())) {
                        formattedMfg = mfg.getFullYear() + '-' + String(mfg.getMonth() + 1).padStart(2, '0') + '-' + String(mfg.getDate()).padStart(2, '0');
                        let exp = new Date(mfg.setFullYear(mfg.getFullYear() + parseInt(gel.exp_years)));
                        formattedExp = exp.getFullYear() + '-' + String(exp.getMonth() + 1).padStart(2, '0') + '-' + String(exp.getDate()).padStart(2, '0');
                        let daysToExp = Math.floor((exp - new Date()) / (1000 * 60 * 60 * 24));
                        isWarning = daysToExp <= 30;
                    }
                    return { ...gel, mfg_date: formattedMfg, exp_date: formattedExp, is_warning: isWarning };
                },
                
                async fetchGels() {
                    try {
                        const res = await fetch(GAS_URL + '?t=' + new Date().getTime());
                        const data = await res.json();
                        this.gels = data.map(gel => this.formatGel(gel));
                    } catch (err) { console.error('取得資料失敗', err); }
                },
                
                async submitForm() {
                    let finalYears = this.formData.exp_type === 'other' ? this.formData.custom_exp : parseInt(this.formData.exp_type);
                    const payload = { ...this.formData, exp_years: finalYears, _action: 'CREATE' };
                    
                    // Optimistic UI: 先在畫面上產生一筆暫存的，或者等待成功後直接 push，避免等待 fetchGels
                    try {
                        const res = await fetch(GAS_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                            body: JSON.stringify(payload)
                        });
                        if (res.ok) {
                            const result = await res.json();
                            this.gels.push(this.formatGel({
                                ...this.formData,
                                exp_years: finalYears,
                                id: result.id || Date.now().toString()
                            }));
                            this.formData.shop_code = '';
                            this.formData.color_name = '';
                        }
                    } catch (err) { console.error('新增失敗', err); }
                },
                
                quickAdd(brand) {
                    this.formData.brand = brand;
                    document.getElementById('addFormSection').scrollIntoView({ behavior: 'smooth' });
                    setTimeout(() => document.getElementById('shop_code_input').focus(), 500);
                },
                
                confirmDeleteBrand(brand) {
                    this.modal.title = '刪除整個品牌？';
                    this.modal.message = `確定要刪除品牌「${brand}」及其所有庫存嗎？此操作無法復原。`;
                    this.modal.action = async () => {
                        // Optimistic UI: 先從畫面上移除
                        this.gels = this.gels.filter(g => g.brand !== brand);
                        try {
                            await fetch(GAS_URL, {
                                method: 'POST',
                                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                                body: JSON.stringify({ _action: 'DELETE_BRAND', brand: brand })
                            });
                        } catch (err) { console.error(err); }
                    };
                    this.modal.isOpen = true;
                },
                
                confirmDeleteGel(id) {
                    this.modal.title = '刪除這筆庫存？';
                    this.modal.message = '確定要刪除這筆紀錄嗎？此操作無法復原。';
                    this.modal.action = async () => {
                        // Optimistic UI: 先從畫面上移除
                        this.gels = this.gels.filter(g => g.id !== id);
                        try {
                            await fetch(GAS_URL, {
                                method: 'POST',
                                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                                body: JSON.stringify({ _action: 'DELETE_GEL', id: id })
                            });
                        } catch (err) { console.error(err); }
                    };
                    this.modal.isOpen = true;
                },
                
                startEdit(gel) {
                    this.editingId = gel.id;
                    let type = [3, 5].includes(parseInt(gel.exp_years)) ? String(gel.exp_years) : 'other';
                    this.editForm = { ...gel, exp_type: type, custom_exp: type === 'other' ? gel.exp_years : 3 };
                },
                
                cancelEdit() { this.editingId = null; },
                
                async saveEdit() {
                    let finalYears = this.editForm.exp_type === 'other' ? this.editForm.custom_exp : parseInt(this.editForm.exp_type);
                    const payload = { ...this.editForm, exp_years: finalYears, _action: 'UPDATE', id: this.editingId };
                    
                    // Optimistic UI
                    let index = this.gels.findIndex(g => g.id === this.editingId);
                    if (index !== -1) {
                        this.gels[index] = this.formatGel({ ...this.gels[index], ...this.editForm, exp_years: finalYears });
                    }
                    this.editingId = null;
                    
                    try {
                        await fetch(GAS_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                            body: JSON.stringify(payload)
                        });
                    } catch (err) { console.error(err); }
                }
            }))
        })
    </script>
